      <!-- Model Solid Curve -->
      <path d="M 16 86 C 75 72, 125 94, 180 78 C 235 66, 275 88, 308 74" fill="none" stroke="#e11d48" stroke-width="2.8"/>
      <circle cx="180" cy="78" r="4" fill="#f59e0b"/>
