      <text x="14" y="24" fill="#a1a1aa" font-family="'JetBrains Mono', Menlo, monospace" font-size="11.5">apexf1hub.com</text>
      <text x="310" y="24" text-anchor="end" fill="#f4f4f6" font-family="'JetBrains Mono', Menlo, monospace" font-size="11.5" font-weight="600">1.7 s Groq Latency</text>

      <rect x="0" y="46" width="324" height="38" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
