      <rect x="4" y="1" width="8" height="1" fill="#e11d48"/>
      <rect x="1" y="2" width="3" height="3" fill="#27272a"/>
      <rect x="12" y="2" width="3" height="3" fill="#27272a"/>
      <rect x="5" y="2" width="6" height="3" fill="#e11d48"/>
      <rect x="6" y="4" width="4" height="3" fill="#be123c"/>
      <rect x="7" y="5" width="2" height="2" fill="#f59e0b"/>
      <rect x="3" y="6" width="10" height="4" fill="#e11d48"/>
      <rect x="5" y="7" width="6" height="3" fill="#be123c"/>
      <rect x="1" y="10" width="3" height="3" fill="#27272a"/>
      <rect x="12" y="10" width="3" height="3" fill="#27272a"/>
      <rect x="5" y="10" width="6" height="2" fill="#e11d48"/>
      <rect x="3" y="12" width="10" height="2" fill="#38bdf8"/>
