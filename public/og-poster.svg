  <rect x="0" y="0" width="1200" height="5" fill="url(#topBar)"/>

  <!-- Left Editorial Content -->
  <!-- Status Chips (Rounded Rectangles rx="6" height="36") -->
  <g transform="translate(72, 68)">
    <rect x="0" y="0" width="372" height="36" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.4"/>
